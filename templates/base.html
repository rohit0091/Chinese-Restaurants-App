{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Mahato Chinese Center{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <header class="site-header">

        <div class="container navbar">

            <a href="{% url 'home' %}" class="logo">
                🥢 Mahato Chinese Center
            </a>

            <nav>
                <a href="{% url 'home' %}">Home</a>
                <a href="{% url 'about' %}">About</a>
                <a href="{% url 'contact' %}">Contact</a>
                <a href="{% url 'menu_home' %}">Menu</a>
                <a href="{% url 'cart_home' %}">Cart</a>
                <a href="{% url 'orders_home' %}">Orders</a>
            </nav>

        </div>

    </header>


    <main>
        {% block content %}
        {% endblock %}
    </main>


    <footer class="site-footer">

        <div class="container">
            <p>
                © 2026 Mahato Chinese Center.
                All rights reserved.
            </p>
        </div>

    </footer>

</body>

</html>
