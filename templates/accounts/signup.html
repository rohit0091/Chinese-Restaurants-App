{% extends 'base.html' %}

{% block title %}Create Account - Mahato Chinese Center{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center my-4">
        <div class="col-md-7 col-lg-6">
            <div class="card border-0 shadow p-5 bg-white rounded-3">
                <div class="text-center mb-4">
                    <div class="mb-3 mx-auto rounded-circle d-flex align-items-center justify-content-center bg-danger-subtle" style="width: 70px; height: 70px;">
                        <i class="fa-solid fa-user-plus fa-2x text-danger"></i>
                    </div>
                    <h2 class="text-dark fw-bold mb-1">Create Your Account</h2>
                    <p class="text-muted">Register to start managing your orders and profiles</p>
                </div>

                <form action="{% url 'signup' %}" method="POST">
                    {% csrf_token %}
                    
                    <div class="row g-3">
                        <div class="col-md-6 mb-2">
                            <label for="username" class="form-label fw-semibold text-muted">Username *</label>
                            <input type="text" name="username" id="username" class="form-control border-secondary-subtle" placeholder="Choose a username" required>
                        </div>
                        <div class="col-md-6 mb-2">
                            <label for="phone" class="form-label fw-semibold text-muted">Phone Number</label>
                            <input type="tel" name="phone" id="phone" class="form-control border-secondary-subtle" placeholder="Enter contact number">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold text-muted">Email Address *</label>
                        <input type="email" name="email" id="email" class="form-control border-secondary-subtle" placeholder="name@example.com" required>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="password" class="form-label fw-semibold text-muted">Password *</label>
                            <input type="password" name="password" id="password" class="form-control border-secondary-subtle" placeholder="Choose password" required>
                        </div>
                        <div class="col-md-6">
                            <label for="password_confirm" class="form-label fw-semibold text-muted">Confirm Password *</label>
                            <input type="password" name="password_confirm" id="password_confirm" class="form-control border-secondary-subtle" placeholder="Verify password" required>
                        </div>
                    </div>

                    <button class="btn btn-danger w-100 rounded-pill py-2 fw-bold" type="submit">Sign Up</button>
                </form>

                <div class="text-center mt-4">
                    <p class="text-muted mb-0">Already registered? <a href="{% url 'login' %}" class="text-danger fw-semibold text-decoration-none">Login Here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
