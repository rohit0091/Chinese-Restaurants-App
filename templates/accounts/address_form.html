{% extends 'base.html' %}

{% block title %}Add Address - Mahato Chinese Center{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-0 shadow-sm p-5 bg-white rounded-3">
                <h3 class="mb-4 text-dark"><i class="fa-solid fa-map-location-dot text-danger me-2"></i>Add Shipping Address</h3>
                
                <form action="{% url 'add_address' %}" method="POST">
                    {% csrf_token %}
                    
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="full_name" class="form-label fw-semibold text-muted">Full Name *</label>
                            <input type="text" name="full_name" id="full_name" class="form-control border-secondary-subtle" placeholder="e.g. Rohit Mahato" required>
                        </div>
                        <div class="col-md-6">
                            <label for="phone" class="form-label fw-semibold text-muted">Contact Phone *</label>
                            <input type="tel" name="phone" id="phone" class="form-control border-secondary-subtle" placeholder="Contact number for delivery" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="address_line_1" class="form-label fw-semibold text-muted">Address Line 1 *</label>
                        <input type="text" name="address_line_1" id="address_line_1" class="form-control border-secondary-subtle" placeholder="Flat, House no., Building, Company, Apartment" required>
                    </div>

                    <div class="mb-3">
                        <label for="address_line_2" class="form-label fw-semibold text-muted">Address Line 2</label>
                        <input type="text" name="address_line_2" id="address_line_2" class="form-control border-secondary-subtle" placeholder="Area, Street, Sector, Village">
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="landmark" class="form-label fw-semibold text-muted">Landmark</label>
                            <input type="text" name="landmark" id="landmark" class="form-control border-secondary-subtle" placeholder="e.g. Near City Temple">
                        </div>
                        <div class="col-md-6">
                            <label for="pincode" class="form-label fw-semibold text-muted">Pincode *</label>
                            <input type="text" name="pincode" id="pincode" class="form-control border-secondary-subtle" placeholder="6-digit pincode" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="city" class="form-label fw-semibold text-muted">City *</label>
                            <input type="text" name="city" id="city" class="form-control border-secondary-subtle" placeholder="City" required>
                        </div>
                        <div class="col-md-6">
                            <label for="state" class="form-label fw-semibold text-muted">State *</label>
                            <input type="text" name="state" id="state" class="form-control border-secondary-subtle" placeholder="State" required>
                        </div>
                    </div>

                    <div class="row g-3 align-items-center mb-4">
                        <div class="col-md-6">
                            <label for="address_type" class="form-label fw-semibold text-muted">Address Type</label>
                            <select name="address_type" id="address_type" class="form-select border-secondary-subtle">
                                <option value="HOME">Home (All-day delivery)</option>
                                <option value="OFFICE">Office (Delivery 9 AM - 6 PM)</option>
                                <option value="OTHER">Other</option>
                            </select>
                        </div>
                        <div class="col-md-6 pt-md-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="is_default" id="is_default">
                                <label class="form-check-label fw-semibold text-muted" for="is_default">
                                    Set as default shipping address
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-3">
                        <button type="submit" class="btn btn-danger rounded-pill px-4">Save Address</button>
                        <a href="{% url 'profile' %}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
